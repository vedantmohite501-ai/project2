<!doctype html>
<html>
  <head>
    <title>Student Feedback System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Student Feedback Form</h1>
      <h4>Class : SY CSE</h4>
      <h4>HOD := MS P.R.Bhosle</h4>
      <h4>Class Co-ordinator:=R.S.Dipankar</h4>
      <form id="feedbackForm">
        <label>Subject Name:</label>
        <input type="text" id="subject" required />

        <label>Teacher Name:</label>
        <input type="text" id="teacher" required />

        <h3>Feedback</h3>

        <p>Syllabus Completion:</p>
        <select id="syllabus">
          <option>Best</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>

        <p>Doubt Solving:</p>
        <select id="doubt">
          <option>Best</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>

        <p>Teacher Audible in Class:</p>
        <select id="audible">
          <option>Best</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>

        <p>Teacher Good in English:</p>
        <select id="english">
          <option>Best</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>
        <a href="principal@nmcoe.org.in" pricipal sir email id></a>
        <h2>Principal:= Dr.S.V.Anekar</h2>

        <button type="submit">Submit Feedback</button>
        <p>
          send mail to us:
          <a>href=" principal@nmcoe.org.in"</a>
        </p>
      </form>

      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
